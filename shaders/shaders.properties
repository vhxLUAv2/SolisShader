# SolisShader settings and render-target formats.
# Shader profiles select performance/quality trade-offs; no FPS level is guaranteed.

shadowMapResolution = 1024
shadowDistance = 96.0
shadowHardwareFiltering = false
colortex0Format = RGBA16F
colortex1Format = RGBA8
colortex2Format = RGBA8
colortex3Format = RGBA8

screen = <profile> [VISUALS] [QUALITY]
screen.VISUALS = ENABLE_TERRAIN_TINT ENABLE_WATER_WAVES ENABLE_SHADOWS ENABLE_VOLUMETRICS ENABLE_BLOOM ENABLE_ADAPTIVE_EXPOSURE ENABLE_SSR ENABLE_CAUSTICS ENABLE_DOF ENABLE_MOTION_BLUR
screen.QUALITY = shadowMapResolution shadowDistance SHADOW_QUALITY VOLUMETRIC_STEPS SSR_STEPS

profile.LOW = shadowMapResolution:512 shadowDistance:48.0 SHADOW_QUALITY:1 VOLUMETRIC_STEPS:4 SSR_STEPS:4 !ENABLE_SHADOWS !program.shadow !ENABLE_VOLUMETRICS !ENABLE_BLOOM !ENABLE_SSR !ENABLE_DOF !ENABLE_MOTION_BLUR !ENABLE_CAUSTICS !ENABLE_WATER_WAVES ENABLE_TERRAIN_TINT ENABLE_ADAPTIVE_EXPOSURE
profile.MEDIUM = shadowMapResolution:1024 shadowDistance:80.0 SHADOW_QUALITY:1 VOLUMETRIC_STEPS:6 SSR_STEPS:6 ENABLE_SHADOWS ENABLE_VOLUMETRICS ENABLE_BLOOM ENABLE_ADAPTIVE_EXPOSURE !ENABLE_SSR !ENABLE_DOF !ENABLE_MOTION_BLUR ENABLE_CAUSTICS ENABLE_WATER_WAVES ENABLE_TERRAIN_TINT
profile.ULTRA = shadowMapResolution:2048 shadowDistance:128.0 SHADOW_QUALITY:2 VOLUMETRIC_STEPS:12 SSR_STEPS:10 ENABLE_SHADOWS ENABLE_VOLUMETRICS ENABLE_BLOOM ENABLE_ADAPTIVE_EXPOSURE ENABLE_SSR ENABLE_DOF ENABLE_MOTION_BLUR ENABLE_CAUSTICS ENABLE_WATER_WAVES ENABLE_TERRAIN_TINT
