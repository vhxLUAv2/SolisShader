# SolisShader preset and render-target settings.
# Profiles tune shader cost; real FPS depends on hardware, resolution, and world.

shadowMapResolution = 1024
shadowDistance = 80.0
shadowHardwareFiltering = false
colortex0Format = RGBA16F
colortex1Format = RGBA8
colortex2Format = RGBA8
colortex3Format = RGBA8

screen = <profile> [VISUALS] [QUALITY]
screen.VISUALS = ENABLE_XRAY ENABLE_FULLBRIGHT ENABLE_TERRAIN_TINT ENABLE_WATER_WAVES ENABLE_SHADOWS ENABLE_VOLUMETRICS ENABLE_BLOOM ENABLE_ADAPTIVE_EXPOSURE ENABLE_SSR ENABLE_CAUSTICS ENABLE_DOF ENABLE_MOTION_BLUR
screen.QUALITY = shadowMapResolution shadowDistance SHADOW_QUALITY VOLUMETRIC_STEPS SSR_STEPS MOTION_BLUR_SAMPLES FOG_DENSITY BLOOM_STRENGTH

profile.LOW = shadowMapResolution:512 shadowDistance:48.0 SHADOW_QUALITY:1 SSR_STEPS:4 VOLUMETRIC_STEPS:3 MOTION_BLUR_SAMPLES:2 FOG_DENSITY:0.004 BLOOM_STRENGTH:0.06 !ENABLE_XRAY !ENABLE_FULLBRIGHT ENABLE_TERRAIN_TINT:1 ENABLE_WATER_WAVES:0 ENABLE_SHADOWS:0 ENABLE_VOLUMETRICS:0 ENABLE_BLOOM:0 ENABLE_ADAPTIVE_EXPOSURE:1 ENABLE_SSR:0 ENABLE_CAUSTICS:0 ENABLE_DOF:0 ENABLE_MOTION_BLUR:0
profile.MEDIUM = shadowMapResolution:1024 shadowDistance:80.0 SHADOW_QUALITY:1 SSR_STEPS:6 VOLUMETRIC_STEPS:4 MOTION_BLUR_SAMPLES:4 FOG_DENSITY:0.006 BLOOM_STRENGTH:0.095 !ENABLE_XRAY !ENABLE_FULLBRIGHT ENABLE_TERRAIN_TINT:1 ENABLE_WATER_WAVES:1 ENABLE_SHADOWS:1 ENABLE_VOLUMETRICS:1 ENABLE_BLOOM:1 ENABLE_ADAPTIVE_EXPOSURE:1 ENABLE_SSR:0 ENABLE_CAUSTICS:1 ENABLE_DOF:0 ENABLE_MOTION_BLUR:0
profile.ULTRA = shadowMapResolution:2048 shadowDistance:128.0 SHADOW_QUALITY:2 SSR_STEPS:8 VOLUMETRIC_STEPS:8 MOTION_BLUR_SAMPLES:4 FOG_DENSITY:0.008 BLOOM_STRENGTH:0.12 !ENABLE_XRAY !ENABLE_FULLBRIGHT ENABLE_TERRAIN_TINT:1 ENABLE_WATER_WAVES:1 ENABLE_SHADOWS:1 ENABLE_VOLUMETRICS:1 ENABLE_BLOOM:1 ENABLE_ADAPTIVE_EXPOSURE:1 ENABLE_SSR:1 ENABLE_CAUSTICS:1 ENABLE_DOF:1 ENABLE_MOTION_BLUR:1
