name: Validate and package SolisShader

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools

      - name: Validate required source and settings
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            shaders/shaders.properties
            shaders/gbuffers_terrain.vsh
            shaders/gbuffers_terrain.fsh
            shaders/gbuffers_water.vsh
            shaders/gbuffers_water.fsh
            shaders/shadow.vsh
            shaders/shadow.fsh
            shaders/shadow_water.vsh
            shaders/shadow_water.fsh
            shaders/composite.vsh
            shaders/composite.fsh
            shaders/composite1.vsh
            shaders/composite1.fsh
            shaders/final.vsh
            shaders/final.fsh
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty file: $file"; exit 1; }
          done

          python3 - <<'PY'
          from pathlib import Path
          import sys

          required = [
              "ENABLE_TERRAIN_TINT", "ENABLE_WATER_WAVES", "ENABLE_SHADOWS",
              "ENABLE_VOLUMETRICS", "ENABLE_BLOOM", "ENABLE_ADAPTIVE_EXPOSURE",
              "ENABLE_SSR", "ENABLE_CAUSTICS", "ENABLE_DOF", "ENABLE_MOTION_BLUR",
              "profile.LOW", "profile.MEDIUM", "profile.ULTRA",
          ]
          props = Path("shaders/shaders.properties").read_text(encoding="utf-8")
          missing = [name for name in required if name not in props]
          if missing:
              print("Missing shader options/profiles: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          source_files = sorted(Path("shaders").glob("*.vsh")) + sorted(Path("shaders").glob("*.fsh"))
          if not source_files:
              print("No shader source files found.", file=sys.stderr)
              sys.exit(1)
          for path in source_files:
              source = path.read_text(encoding="utf-8")
              if not source.startswith("#version 330 compatibility"):
                  print(f"{path}: expected GLSL 330 compatibility directive", file=sys.stderr)
                  sys.exit(1)
              if source.count("{") != source.count("}"):
                  print(f"{path}: mismatched brace count", file=sys.stderr)
                  sys.exit(1)
              if "\x00" in source:
                  print(f"{path}: NUL byte detected", file=sys.stderr)
                  sys.exit(1)
          print(f"Validated {len(source_files)} GLSL stages and shader settings.")
          PY

      - name: Compile GLSL stages
        shell: bash
        run: |
          set -euo pipefail
          for file in shaders/*.vsh; do
            echo "Checking vertex shader: $file"
            glslangValidator -S vert "$file"
          done
          for file in shaders/*.fsh; do
            echo "Checking fragment shader: $file"
            glslangValidator -S frag "$file"
          done

      - name: Package shader pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/SolisShader
          cp -R shaders dist/SolisShader/shaders
          cp README.md dist/SolisShader/README.md
          cd dist/SolisShader
          zip -qr ../../SolisShader.zip shaders README.md
          cd ../..
          unzip -l SolisShader.zip
          test -s SolisShader.zip
          unzip -Z1 SolisShader.zip | grep -q '^shaders/shaders.properties$'
          unzip -Z1 SolisShader.zip | grep -q '^shaders/final.fsh$'

      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolisShader
          path: SolisShader.zip
          if-no-files-found: error
          retention-days: 30

      # A stable URL lets users download the actual shader pack ZIP without
      # first downloading GitHub's wrapper artifact ZIP and extracting it.
      - name: Publish direct GitHub download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SolisShader Latest Build
          body: |
            Automatically packaged SolisShader build from the main branch.
            Download SolisShader.zip and place it directly in the Minecraft shaderpacks folder.
            The shader pack is GLSL-validated; in-game compatibility and FPS are not guaranteed.
          target_commitish: ${{ github.sha }}
          files: SolisShader.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
