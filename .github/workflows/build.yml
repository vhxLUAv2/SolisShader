name: Build mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: stone-brick-trapdoor-minecraft-26.2
          path: build/libs/*.jar
          if-no-files-found: error
